[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
node = { path = "crates/node" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No panics on untrusted input (SECURITY.md rule 18). Tests opt out locally.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
