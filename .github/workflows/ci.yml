name: CI

# The budget is under 3 minutes wall-clock with a warm cache; each job also has its own limit,
# checked by its last step (docs/CI.md "Budget").
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every master run finish so it saves caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # PRs run only the jobs their paths need. A master push runs every job when it touches code,
    # which verifies the merge and refreshes the caches, and nothing when it touches only docs.
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || (github.event_name == 'push' && steps.filter.outputs.code == 'true') }}
      web: ${{ steps.filter.outputs.web == 'true' || (github.event_name == 'push' && steps.filter.outputs.code == 'true') }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || (github.event_name == 'push' && steps.filter.outputs.code == 'true') }}
      # The post-merge Image workflow builds the whole image, so master skips this.
      image: ${{ github.event_name == 'pull_request' && steps.filter.outputs.image == 'true' }}
    steps:
      # A push is compared with the commit before it, which needs the repository; a PR uses the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust: &rust
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - crates/**
              - dev/load/**
              - .config/nextest.toml
              - .github/workflows/ci.yml
              - .github/job-limit.sh
              - .github/slowest.py
            web: &web
              - web/**
              # What the frontend imports from design/; the prototype is not built.
              - design/tokens.css
              - design/logo.svg
              - design/fonts/**
              - .github/workflows/ci.yml
              - .github/job-limit.sh
            e2e: &e2e
              - *rust
              - *web
              - dev/regtest/**
            image:
              - *web
              - Dockerfile
              - .dockerignore
            code:
              - *e2e
              - Dockerfile
              - .dockerignore

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      # The job's limit in seconds, a little above its time on the day it was set (docs/CI.md).
      JOB_LIMIT: 120
      NEXTEST_VERSION: 0.9.149
      NEXTEST_SHA256: 32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # nextest runs every test binary at once, not one after another, and times each test. The
      # release binary, checked against the checksum pinned above, instead of compiling it.
      - name: Install cargo-nextest
        run: |
          name=cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$name"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/nextest"
          tar xzf "$RUNNER_TEMP/nextest.tgz" -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Examples are not tests: clippy above already checks they build.
      - run: cargo nextest run --locked --profile ci --lib --bins --tests
      - run: cargo test --locked --doc
      - name: Slowest tests
        if: always()
        run: python3 -I .github/slowest.py target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Within the job's limit
        run: .github/job-limit.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JOB_LIMIT: 60
    defaults:
      run:
        working-directory: web
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run size
      - name: Within the job's limit
        run: ../.github/job-limit.sh

  # The server and frontend built from the PR, against rbitcoin on regtest, in headless Chromium.
  # scripts/e2e.sh starts the node and the browser download first and builds meanwhile, so neither
  # is on the critical path. The browser is not cached: restoring it took longer than downloading.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      JOB_LIMIT: 120
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ runner.temp }}/e2e-junit.xml
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only the server binary's build, so this cache is smaller than the rust job's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
          no-cache: true
      - run: bun install --frozen-lockfile
        working-directory: web
      # Four workers on the runner's four cores: the tests mostly wait on the page and the node.
      - run: bun run e2e --workers=4 --reporter=list,junit
        working-directory: web
      - name: Slowest tests
        if: always()
        run: python3 -I .github/slowest.py "$PLAYWRIGHT_JUNIT_OUTPUT_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Within the job's limit
        run: .github/job-limit.sh

  # The image's frontend stage alone: it catches a Dockerfile that no longer builds the frontend,
  # without the Rust stage, which the post-merge Image workflow builds.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target web .

  ci-ok:
    if: always()
    needs: [changes, rust, web, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
