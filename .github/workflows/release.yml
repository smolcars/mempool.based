name: Release

# The server's image for linux/amd64 and linux/arm64, each built natively on its own runner,
# joined into one multi-architecture image. docs/CI.md and docs/DEPLOY.md explain it.
#
# - A version tag (v1.2.3, equal to the version in Cargo.toml) publishes the image to
#   ghcr.io/<owner>/<repo> as 1.2.3 and latest, with a signed provenance attestation, and creates
#   the GitHub release.
# - A merge to master that touches what goes into the image publishes it as sha-<commit> and
#   master, with the same attestation. Never as latest or a version.
# - A manual dispatch is a dry run that publishes nothing: it builds, checks and joins both
#   architectures.
# Never on pull requests, so it is outside the PR budget.
on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Not evaluated for tags: a tag always runs.
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - web/**
      - design/**
      - deploy/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Every run publishes or proves a commit, so none is cancelled, even pending: master's runs wait
  # in one queue and run in the order they joined it (docs/CI.md).
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture: no emulation.
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # The server reports this version at /healthz, so the tag must say the same.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          start=$(date +%s)
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label org.opencontainers.image.licenses=MIT \
            -t rbitcoin-space .
          echo "$ARCH: built in $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the contents
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' rbitcoin-space)" = 65532:65532
          c=$(docker create rbitcoin-space)
          docker export "$c" | tar -t > files.txt
          docker rm "$c"
          # The server is the only program: no shell, package manager, compiler or runtime.
          programs=$(grep -E '^(usr/)?(local/)?s?bin/.' files.txt || true)
          [ "$programs" = usr/local/bin/rbitcoin-space ] || { echo "$programs"; exit 1; }
          # .dockerignore is an allow-list; this catches it being loosened.
          if grep -E '(^|/)(\.env|rpc\.cookie|\.git)(/|$)' files.txt; then exit 1; fi
      # Started with the hardening deploy/compose.yml applies, it must pass its own health check.
      - name: Run it
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges rbitcoin-space
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Check the compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          touch rpc.cookie
          docker compose config --quiet
      - run: docker save rbitcoin-space -o "image-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          retention-days: 7
          if-no-files-found: error

  # Joins the two images into one OCI layout with an index over both, without a registry, so a
  # dry run proves the join too. The publish job pushes exactly this layout.
  join:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      version: ${{ needs.build.outputs.version }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Join
        run: |
          set -euo pipefail
          blob() { cat "layout/blobs/${1%%:*}/${1#*:}"; }
          for arch in amd64 arm64; do
            # skopeo is on GitHub's Ubuntu runners. docker save writes an OCI layout: read it as one,
            # since reading it as docker-archive drops Docker's HEALTHCHECK. The layers get gzipped.
            skopeo copy --quiet "oci-archive:image-$arch.tar" "oci:layout:$arch"
          done
          manifests=$(for arch in amd64 arm64; do
            m=$(jq -c --arg a "$arch" '.manifests[] | select(.annotations["org.opencontainers.image.ref.name"] == $a)' layout/index.json)
            config=$(blob "$(jq -r .digest <<< "$m")" | jq -r .config.digest)
            platform=$(blob "$config" | jq -c '{architecture, os} + if .variant then {variant} else {} end')
            [ "$(jq -r .architecture <<< "$platform")" = "$arch" ]
            jq -c --argjson p "$platform" '{mediaType, digest, size, platform: $p}' <<< "$m"
          done | jq -s -c .)
          jq -n --argjson m "$manifests" \
            --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" --arg version "$VERSION" \
            '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: $m, annotations: {
              "org.opencontainers.image.source": $source, "org.opencontainers.image.revision": $revision,
              "org.opencontainers.image.version": $version, "org.opencontainers.image.licenses": "MIT",
              "org.opencontainers.image.description": "rbitcoin.space, a block explorer for rbitcoin"}}' > index.json
          digest=sha256:$(sha256sum index.json | cut -d' ' -f1)
          cp index.json "layout/blobs/sha256/${digest#sha256:}"
          jq --arg d "$digest" --argjson s "$(wc -c < index.json)" --arg v "$VERSION" \
            '.manifests += [{mediaType: "application/vnd.oci.image.index.v1+json", digest: $d, size: $s,
              annotations: {"org.opencontainers.image.ref.name": $v}}]' layout/index.json > i.json
          mv i.json layout/index.json
          echo "$digest" > layout/digest
          {
            echo "Image $VERSION, index \`$digest\`"
            echo
            echo "| Platform | Manifest | Compressed |"
            echo "|---|---|---|"
            for d in $(jq -r '.manifests[].digest' index.json); do
              size=$(blob "$d" | jq '[.config.size, .layers[].size] | add')
              echo "| $(jq -r --arg d "$d" '.manifests[] | select(.digest == $d) | .platform | "\(.os)/\(.architecture)"' index.json) | \`$d\` | $(awk -v s="$size" 'BEGIN { printf "%.1f", s / 1e6 }') MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$GITHUB_EVENT_NAME" = push ] || echo "Dry run: nothing is published." >> "$GITHUB_STEP_SUMMARY"
      # The joined image, taken back out of the layout for this runner's platform, still runs.
      - name: Run the joined image
        run: |
          skopeo copy --quiet "oci:layout:$VERSION" docker-archive:joined.tar:rbitcoin-space:joined
          docker load --quiet --input joined.tar
          docker run -d --name joined --read-only --cap-drop ALL --security-opt no-new-privileges rbitcoin-space:joined
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' joined)" = healthy ] && exit 0
            sleep 1
          done
          docker logs joined
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-index
          path: layout
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: join
    # A push of a tag or to master, never a manual run: a dispatch is a dry run on any ref.
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')
    # One publisher at a time across every tag and master, so the read of what latest or master
    # points at and the move cannot interleave. Queued, because by default a third run's publish
    # would cancel the second's while it waits.
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # compare master's commit with this one
      packages: write # push the image
      id-token: write # sign the provenance attestation
      attestations: write # record it
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-index
          path: layout
      - name: Push
        id: push
        env:
          VERSION: ${{ needs.join.outputs.version }}
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          digest=$(cat layout/digest)
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          # Reads a tag's index into m.json; fails when the tag is not there. ghcr.io answers
          # "manifest unknown" for a tag it lacks, "name unknown" before the package exists; any other
          # failure stops here.
          fetch() {
            skopeo inspect --raw "docker://$image:$1" > m.json 2> err.txt && return 0
            grep -qE 'manifest unknown|name unknown' err.txt && return 1
            echo "::error::Could not read $image:$1: $(cat err.txt)"
            exit 1
          }
          fetched() { echo "sha256:$(sha256sum < m.json | cut -d' ' -f1)"; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A version is pushed once: re-running an old release must not replace it or move latest.
            if fetch "$VERSION"; then
              echo "::error::$image:$VERSION is already published"
              exit 1
            fi
            # latest only moves forward: a patch to an older line keeps it where it is. Before the
            # first release the package does not exist: "name unknown".
            if out=$(skopeo list-tags "docker://$image" 2>&1); then
              published=$(jq -r '.Tags[]' <<< "$out")
            elif [[ $out == *"name unknown"* ]]; then
              published=
            else
              echo "::error::Could not list the tags of $image: $out"
              exit 1
            fi
            newest=$(printf '%s\n' $published "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            tags=("$VERSION")
            [ "$newest" != "$VERSION" ] || tags+=(latest)
          else
            # A commit's image is pushed once. Re-running only this job pushes the same bytes again;
            # a rebuild of a published commit is refused, so its tag never changes.
            tags=("sha-$GITHUB_SHA")
            if fetch "${tags[0]}" && [ "$(fetched)" != "$digest" ]; then
              echo "::error::$image:${tags[0]} is already published as $(fetched)"
              exit 1
            fi
            # master only moves forward: a run for an older commit, finished late or re-run after a
            # newer one, leaves it where it is.
            if ! fetch master; then
              tags+=(master)
            else
              at=$(jq -r '.annotations["org.opencontainers.image.revision"]' m.json)
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$at...$GITHUB_SHA" --jq .status)
              case $status in
                ahead | identical) tags+=(master) ;;
                *) echo "master stays at $at: compared with it, this commit is $status." >> "$GITHUB_STEP_SUMMARY" ;;
              esac
            fi
          fi
          for tag in "${tags[@]}"; do
            # --preserve-digests: the registry holds byte for byte the index the join checked.
            skopeo copy --all --preserve-digests "oci:layout:$VERSION" "docker://$image:$tag"
          done
          fetch "${tags[0]}"
          [ "$(fetched)" = "$digest" ]
          echo "Published $image:${tags[*]} as \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [join, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.join.outputs.version }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          tree="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          notes=$(cat <<EOF
          The server and its frontend in one image for linux/amd64 and linux/arm64, beside rbitcoin v0.9.2.

              $IMAGE:$VERSION
              $IMAGE@$DIGEST

          Verify where it was built: \`gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY\`

          Run it, upgrade to it and roll back from it with [the operator guide]($tree/docs/DEPLOY.md). Schema migrations run by themselves and are one-way: back up the data directory before upgrading.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "rbitcoin.space $VERSION" --notes "$notes" --generate-notes
