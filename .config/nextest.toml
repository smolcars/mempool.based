# How CI runs the Rust tests (docs/CI.md "The Rust tests"). Locally: `cargo nextest run`.
[profile.default]
# Most slow tests wait on a socket or a timer, not the CPU, so more run at once than there are
# cores. Each test is its own process, so the test binaries no longer run one after another.
test-threads = 12
# A test past 10 s is reported as slow; past 30 s it is stopped and fails. Nothing in the suite
# comes near that: a test that does belongs behind `#[ignore]` with its command beside it.
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.ci]
fail-fast = false

[profile.ci.junit]
# Read by the job's summary of its slowest tests.
path = "junit.xml"
